                                <tr>
                                    <td align="center" style="padding-bottom: 24px;">
                                        <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                                            <tr>

    <!-- 데모용: URL 파라미터에서 인증코드를 읽어 표시 -->
    <script>
        (function() {
            var code = new URLSearchParams(window.location.search).get('code') || '000000';
            for (var i = 0; i < 6; i++) {
                var el = document.getElementById('code-' + (i + 1));
                if (el) el.textContent = code[i] || '0';
            }
        })();
    </script>
