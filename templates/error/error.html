<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서비스 오류 - 쏠쏠</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f9fafb;
            color: #111827;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-page {
            width: 100%;
            padding: 2.5rem 1rem 3rem;
        }

        .error-page-content {
            max-width: 520px;
            margin: 0 auto;
            text-align: center;
        }

        /* Logo */
        .error-logo {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            margin-bottom: 1.5rem;
        }

        .error-logo-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: #111827;
            line-height: 1;
        }

        .error-logo-sub {
            font-size: 0.55rem;
            color: #6b7280;
            letter-spacing: 0.1em;
        }

        /* Illustration */
        .error-illustration {
            width: 100%;
            max-width: 300px;
            background: #ede9fe;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #ddd6fe;
            padding: 2rem 1.5rem;
            margin: 0 auto 3rem;
        }

        .error-illustration svg {
            width: 100%;
            height: auto;
        }

        /* Title */
        .error-title {
            font-size: 1.625rem;
            font-weight: 800;
            color: #111827;
            margin-bottom: 1.25rem;
            letter-spacing: -0.01em;
        }

        /* Description */
        .error-desc {
            font-size: 0.9375rem;
            color: #6b7280;
            line-height: 1.8;
            margin-bottom: 2.5rem;
        }

        /* Button */
        .error-btn {
            display: inline-block;
            background: #312e81;
            color: white;
            border: none;
            border-radius: 50rem;
            padding: 1rem 0;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.2s;
            width: 100%;
            max-width: 260px;
            cursor: pointer;
        }

        .error-btn:hover {
            background: #272463;
            color: white;
        }

        @media (max-width: 768px) {
            .error-page { padding: 2rem 1rem; }
            .error-illustration { max-width: 260px; }
            .error-title { font-size: 1.25rem; }
            .error-btn { min-width: 180px; padding: 0.75rem 3rem; }
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-page-content">
            <!-- Logo -->
            <div>
                <a href="/" class="error-logo">
                    <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
                        <defs>
                            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#06b6d4"/>
                                <stop offset="100%" stop-color="#8b5cf6"/>
                            </linearGradient>
                        </defs>
                        <path d="M6 18 C10 10, 14 26, 18 18 C22 10, 26 26, 30 18" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                        <path d="M6 13 C10 5, 14 21, 18 13 C22 5, 26 21, 30 13" stroke="url(#logoGrad)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
                        <path d="M6 23 C10 15, 14 31, 18 23 C22 15, 26 31, 30 23" stroke="url(#logoGrad)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
                    </svg>
                    <div>
                        <div class="error-logo-text">쏠쏠</div>
                        <div class="error-logo-sub">CREATOR PLATFORM</div>
                    </div>
                </a>
            </div>

            <!-- Illustration -->
            <div class="error-illustration">
                <svg viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Background circle -->
                    <circle cx="100" cy="80" r="45" fill="#c4b5fd" opacity="0.3"/>

                    <!-- Browser window -->
                    <rect x="60" y="45" width="80" height="60" rx="6" fill="white" stroke="#a78bfa" stroke-width="2"/>
                    <rect x="60" y="45" width="80" height="14" rx="6" fill="#f5f3ff"/>
                    <rect x="60" y="53" width="80" height="6" fill="#f5f3ff"/>
                    <circle cx="72" cy="52" r="2.5" fill="#fca5a5"/>
                    <circle cx="80" cy="52" r="2.5" fill="#fcd34d"/>
                    <circle cx="88" cy="52" r="2.5" fill="#86efac"/>

                    <!-- Content lines -->
                    <rect x="70" y="68" width="60" height="4" rx="2" fill="#ede9fe"/>
                    <rect x="70" y="76" width="45" height="4" rx="2" fill="#f5f3ff"/>
                    <rect x="70" y="84" width="50" height="4" rx="2" fill="#f5f3ff"/>

                    <!-- Error indicator -->
                    <rect x="78" y="92" width="44" height="8" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>

                    <!-- Warning badge -->
                    <circle cx="130" cy="65" r="12" fill="#fbbf24"/>
                    <rect x="128.5" y="57" width="3" height="10" rx="1.5" fill="white"/>
                    <circle cx="130" cy="71" r="2" fill="white"/>

                    <!-- Decorations -->
                    <circle cx="50" cy="55" r="5" fill="#ddd6fe"/>
                    <circle cx="155" cy="50" r="4" fill="#ede9fe"/>
                    <circle cx="45" cy="115" r="3" fill="#ede9fe"/>
                </svg>
            </div>

            <h1 class="error-title">"서비스 이용에 불편을 드려 죄송해요"</h1>
            <p class="error-desc">
                편리하게 서비스를 이용하실 수 있도록<br>
                최선의 노력을 다하고 있어요
            </p>
            <a href="/" class="error-btn">홈으로 가기</a>
        </div>
    </div>
</body>
</html>
