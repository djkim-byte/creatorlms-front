<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시스템 정기점검 - 쏠쏠</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f9fafb;
            color: #111827;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-page {
            width: 100%;
            padding: 2.5rem 1rem 3rem;
        }

        .error-page-content {
            max-width: 520px;
            margin: 0 auto;
            text-align: center;
        }

        /* Logo */
        .error-logo {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            margin-bottom: 1.5rem;
        }

        .error-logo-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: #111827;
            line-height: 1;
        }

        .error-logo-sub {
            font-size: 0.55rem;
            color: #6b7280;
            letter-spacing: 0.1em;
        }

        /* Illustration */
        .error-illustration {
            width: 100%;
            max-width: 300px;
            background: #ede9fe;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #ddd6fe;
            padding: 2rem 1.5rem;
            margin: 0 auto 3rem;
        }

        .error-illustration svg {
            width: 100%;
            height: auto;
        }

        /* Title */
        .error-title-lg {
            font-size: 1.875rem;
            font-weight: 800;
            color: #111827;
            margin-bottom: 0.75rem;
            letter-spacing: -0.01em;
        }

        /* Subtitle */
        .error-subtitle {
            font-size: 1.125rem;
            font-weight: 500;
            color: #4b5563;
            margin-bottom: 1.5rem;
        }

        /* Description */
        .error-desc {
            font-size: 0.9375rem;
            color: #6b7280;
            line-height: 1.8;
            margin-bottom: 2.5rem;
        }

        /* Schedule */
        .error-schedule-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.9375rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 0.75rem;
        }

        .error-schedule-list {
            list-style: disc;
            padding: 0;
            display: inline-block;
            text-align: left;
        }

        .error-schedule-list li {
            font-size: 0.875rem;
            color: #6b7280;
        }

        @media (max-width: 768px) {
            .error-page { padding: 2rem 1rem; }
            .error-illustration { max-width: 260px; }
            .error-title-lg { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-page-content">
            <!-- Logo -->
            <div>
                <a href="/" class="error-logo">
                    <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
                        <defs>
                            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#06b6d4"/>
                                <stop offset="100%" stop-color="#8b5cf6"/>
                            </linearGradient>
                        </defs>
                        <path d="M6 18 C10 10, 14 26, 18 18 C22 10, 26 26, 30 18" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                        <path d="M6 13 C10 5, 14 21, 18 13 C22 5, 26 21, 30 13" stroke="url(#logoGrad)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
                        <path d="M6 23 C10 15, 14 31, 18 23 C22 15, 26 31, 30 23" stroke="url(#logoGrad)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
                    </svg>
                    <div>
                        <div class="error-logo-text">쏠쏠</div>
                        <div class="error-logo-sub">CREATOR PLATFORM</div>
                    </div>
                </a>
            </div>

            <!-- Illustration -->
            <div class="error-illustration">
                <svg viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Background circle -->
                    <circle cx="100" cy="80" r="45" fill="#c4b5fd" opacity="0.3"/>

                    <!-- Server rack -->
                    <rect x="65" y="40" width="70" height="85" rx="6" fill="white" stroke="#a78bfa" stroke-width="2"/>

                    <!-- Server unit 1 -->
                    <rect x="73" y="50" width="54" height="18" rx="3" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
                    <circle cx="82" cy="59" r="3" fill="#86efac"/>
                    <rect x="90" y="56" width="20" height="2" rx="1" fill="#ddd6fe"/>
                    <rect x="90" y="60" width="14" height="2" rx="1" fill="#ede9fe"/>
                    <rect x="117" y="56" width="4" height="6" rx="1" fill="#ddd6fe"/>

                    <!-- Server unit 2 -->
                    <rect x="73" y="74" width="54" height="18" rx="3" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
                    <circle cx="82" cy="83" r="3" fill="#fbbf24"/>
                    <rect x="90" y="80" width="20" height="2" rx="1" fill="#ddd6fe"/>
                    <rect x="90" y="84" width="14" height="2" rx="1" fill="#ede9fe"/>
                    <rect x="117" y="80" width="4" height="6" rx="1" fill="#ddd6fe"/>

                    <!-- Server unit 3 -->
                    <rect x="73" y="98" width="54" height="18" rx="3" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
                    <circle cx="82" cy="107" r="3" fill="#fca5a5"/>
                    <rect x="90" y="104" width="20" height="2" rx="1" fill="#ddd6fe"/>
                    <rect x="90" y="108" width="14" height="2" rx="1" fill="#ede9fe"/>
                    <rect x="117" y="104" width="4" height="6" rx="1" fill="#ddd6fe"/>

                    <!-- Wrench icon -->
                    <circle cx="145" cy="55" r="14" fill="#fbbf24"/>
                    <path d="M140 50 L143 53 L141 55 L138 52 C137 54 137.5 56.5 139.5 58 C141.5 59.5 144 59.5 145.5 58.5 L150 63 L152 61 L147 56.5 C148 55 148 52.5 146 50.5 C144 48.5 141.5 48.5 140 50Z" fill="white"/>

                    <!-- Decorations -->
                    <circle cx="45" cy="60" r="5" fill="#ddd6fe"/>
                    <circle cx="160" cy="100" r="4" fill="#ede9fe"/>
                    <circle cx="50" cy="115" r="3" fill="#ede9fe"/>
                </svg>
            </div>

            <h1 class="error-title-lg" style="white-space: nowrap;">서비스 안정화를 위한 시스템 정기점검 안내</h1>
            <p class="error-subtitle">원활한 서비스를 위해 시스템 점검 중이에요.</p>
            <p class="error-desc">
                점검시간 동안 서비스 이용이 제한돼요.<br>
                더욱 나은 서비스로 찾아 뵐게요!
            </p>

            <!-- 점검 예정시간 -->
            <div>
                <p class="error-schedule-label">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="16" x2="12" y2="12"/>
                        <line x1="12" y1="8" x2="12.01" y2="8"/>
                    </svg>
                    서비스 점검 예정시간
                </p>
                <ul class="error-schedule-list">
                    <li>2026.05.13 24:00 ~ 2026.05.14 04:00</li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
