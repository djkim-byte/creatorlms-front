<div style="background: var(--gray-100); min-height: 100%;">
<div class="container py-4 py-lg-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="welcome-card text-center">
                <!-- Check Icon -->
                <div class="welcome-check-icon mx-auto mb-4">
                    <i class="bi bi-check-lg"></i>
                </div>

                <!-- Title -->
                <h2 class="fw-bold mb-3">환영합니다!</h2>
                <p class="text-secondary mb-1">쏠쏠 회원가입이 완료되었습니다.</p>
                <p class="text-secondary mb-4">이제 크리에이터를 위한 최고의 수익화 플랫폼을 경험해보세요!</p>

                <!-- User Info -->
                <div class="welcome-info-box mx-auto mb-4">
                    <p class="mb-2">이메일: {{ email }}</p>
                    <span class="badge rounded-pill welcome-plan-badge">{{ planName }}</span>
                </div>

                <!-- Next Steps -->
                <h3 class="fw-bold mb-4"><span style="color: var(--primary-color);">1분 만에 만드는 내 사이트</span>, 바로 만들어 보세요</h3>

                <div class="row g-3 mb-4">
                    <div class="col-12 col-md-4">
                        <div class="welcome-step-card">
                            <span class="welcome-step-number">1</span>
                            <h6 class="fw-bold mt-2 mb-1">내 사이트 관리하기</h6>
                            <p class="text-secondary small mb-0">나만의 학습 사이트를 빠르게 구축하세요</p>
                        </div>
                    </div>
                    <div class="col-12 col-md-4">
                        <div class="welcome-step-card">
                            <span class="welcome-step-number">2</span>
                            <h6 class="fw-bold mt-2 mb-1">첫 강좌 업로드</h6>
                            <p class="text-secondary small mb-0">YouTube 영상 링크, 또는 직접 영상을 업로드 하세요</p>
                        </div>
                    </div>
                    <div class="col-12 col-md-4">
                        <div class="welcome-step-card">
                            <span class="welcome-step-number">3</span>
                            <h6 class="fw-bold mt-2 mb-1">YouTube 연동</h6>
                            <p class="text-secondary small mb-0">멤버십 회원을 쉽게 초대해 보세요</p>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="d-flex justify-content-center">
                    <button class="btn welcome-primary-btn px-5 py-3 w-100" style="max-width: 400px;" @click="goToAdmin">
                        <i class="bi bi-rocket-takeoff me-2"></i>
                        사이트 바로 만들기
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
