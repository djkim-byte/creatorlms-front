<div class="dcd-home">
    <!-- Hero -->
    <section class="dcd-hero">
        <div class="container">
            <div class="row g-0 dcd-hero-row align-items-stretch">
                <div class="col-lg-6 order-2 order-lg-1 dcd-hero-text-col">
                    <div class="dcd-hero-text">
                        <span class="dcd-eyebrow dcd-eyebrow-light">FEATURED · {{ hero.tag }}</span>
                        <h1 class="dcd-hero-title">{{ hero.title }}</h1>
                        <p class="dcd-hero-desc">{{ hero.desc }}</p>
                        <div class="dcd-hero-meta">
                            <span>{{ hero.date }}</span>
                            <span class="dcd-meta-sep">·</span>
                            <span>{{ hero.read }}</span>
                        </div>
                        <a :href="hero.href" class="dcd-hero-cta" @click="guardNav($event)">
                            자세히 보기 <i class="bi bi-arrow-right ms-1"></i>
                        </a>
                    </div>
                </div>
                <div class="col-lg-6 order-1 order-lg-2 dcd-hero-image-col">
                    <div class="dcd-hero-image" :style="{ backgroundImage: `url(${hero.image})` }" role="img" :aria-label="hero.title"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Latest posts -->
    <section class="dcd-section">
        <div class="container">
            <header class="dcd-section-head">
                <div>
                    <span class="dcd-eyebrow">LATEST</span>
                    <h2 class="dcd-section-title">최신 콘텐츠</h2>
                    <p class="dcd-section-sub">DRONE · C-DRONE · TACTICS · OTHERS — 최근 업데이트 순</p>
                </div>
            </header>

            <div class="row g-4 dcd-card-grid">
                <div v-for="item in sortedPosts" :key="item.id" class="col-12 col-md-6 col-lg-4">
                    <article class="dcd-card">
                        <a :href="item.href" class="dcd-card-thumb-link" :aria-label="item.title" @click="guardNav($event)">
                            <div class="dcd-card-thumb" :style="{ backgroundImage: `url(${item.image})` }"></div>
                        </a>
                        <div class="dcd-card-body">
                            <span class="dcd-card-tag">{{ item.category }}</span>
                            <h3 class="dcd-card-title">
                                <a :href="item.href" @click="guardNav($event)">{{ item.title }}</a>
                            </h3>
                            <p class="dcd-card-desc">{{ item.desc }}</p>
                            <div class="dcd-card-meta">
                                <span>{{ item.date }}</span>
                                <span class="dcd-meta-sep">·</span>
                                <span>{{ item.read }}</span>
                            </div>
                        </div>
                    </article>
                </div>
            </div>
        </div>
    </section>
</div>
