<div class="landing-layout">
    <!-- GNB Header -->
    <header class="landing-gnb dcd-gnb" :class="{ 'gnb-scrolled': isScrolled }">
        <div class="container-fluid px-3 px-lg-4">
            <div class="d-flex align-items-center justify-content-between dcd-gnb-row">
                <!-- Logo -->
                <a href="#/home" class="dcd-brand text-decoration-none d-inline-flex align-items-center" aria-label="DcD 홈">
                    <span class="dcd-brand-mark" aria-hidden="true">
                        <span class="dcd-d">D</span><span class="dcd-c">c</span><span class="dcd-d">D</span>
                    </span>
                </a>

                <!-- Center Nav (desktop) -->
                <nav class="d-none d-lg-flex align-items-center gap-1 mx-auto" aria-label="주 메뉴">
                    <a class="dcd-nav-link" :class="{ active: isActive('/drone') }" href="#/drone">DRONE</a>
                    <a class="dcd-nav-link" :class="{ active: isActive('/c-drone') }" href="#/c-drone">C-DRONE</a>
                    <a class="dcd-nav-link" :class="{ active: isActive('/tactics') }" href="#/tactics">TACTICS</a>
                    <a class="dcd-nav-link" :class="{ active: isActive('/others') }" href="#/others">OTHERS</a>
                </nav>

                <!-- Right Actions (desktop) -->
                <div class="d-none d-lg-flex align-items-center gap-3">
                    <div class="dcd-lang" role="group" aria-label="Language">
                        <button type="button" class="dcd-lang-btn" :class="{ active: lang === 'ko' }" @click="setLang('ko')">한국어</button>
                        <span class="dcd-lang-sep" aria-hidden="true">/</span>
                        <button type="button" class="dcd-lang-btn" :class="{ active: lang === 'en' }" @click="setLang('en')">English</button>
                    </div>
                    <span class="dcd-divider" aria-hidden="true"></span>
                    <div class="dcd-auth">
                        <a href="#/login" class="dcd-auth-link">로그인</a>
                        <span class="dcd-auth-sep" aria-hidden="true">|</span>
                        <a href="#/signup" class="dcd-auth-link dcd-auth-cta">회원가입</a>
                    </div>
                </div>

                <!-- Mobile toggle -->
                <button class="dcd-mobile-toggle d-lg-none" type="button" @click="toggleMobileMenu" :aria-expanded="mobileMenuOpen" aria-label="메뉴 열기">
                    <i class="bi" :class="mobileMenuOpen ? 'bi-x-lg' : 'bi-list'"></i>
                </button>
            </div>
        </div>

        <!-- Mobile Slide-down Nav -->
        <div class="dcd-mobile-nav" v-show="mobileMenuOpen">
            <div class="container-fluid px-3 py-3">
                <nav class="d-flex flex-column" aria-label="모바일 메뉴">
                    <a class="dcd-mobile-link" :class="{ active: isActive('/drone') }" href="#/drone" @click="closeMobileMenu">DRONE</a>
                    <a class="dcd-mobile-link" :class="{ active: isActive('/c-drone') }" href="#/c-drone" @click="closeMobileMenu">C-DRONE</a>
                    <a class="dcd-mobile-link" :class="{ active: isActive('/tactics') }" href="#/tactics" @click="closeMobileMenu">TACTICS</a>
                    <a class="dcd-mobile-link" :class="{ active: isActive('/others') }" href="#/others" @click="closeMobileMenu">OTHERS</a>
                </nav>
                <div class="dcd-mobile-actions">
                    <div class="dcd-lang">
                        <button type="button" class="dcd-lang-btn" :class="{ active: lang === 'ko' }" @click="setLang('ko')">한국어</button>
                        <span class="dcd-lang-sep" aria-hidden="true">/</span>
                        <button type="button" class="dcd-lang-btn" :class="{ active: lang === 'en' }" @click="setLang('en')">English</button>
                    </div>
                    <div class="dcd-auth">
                        <a href="#/login" class="dcd-auth-link" @click="closeMobileMenu">로그인</a>
                        <span class="dcd-auth-sep" aria-hidden="true">|</span>
                        <a href="#/signup" class="dcd-auth-link dcd-auth-cta" @click="closeMobileMenu">회원가입</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        {{ content }}
    </main>

    <!-- Footer -->
    <footer class="dcd-footer">
        <div class="container-fluid px-3 px-lg-4">
            <div class="dcd-footer-row">
                <a href="#/home" class="dcd-brand text-decoration-none d-inline-flex align-items-center" aria-label="DcD 홈">
                    <span class="dcd-brand-mark dcd-brand-mark-sm" aria-hidden="true">
                        <span class="dcd-d">D</span><span class="dcd-c">c</span><span class="dcd-d">D</span>
                    </span>
                </a>
                <p class="dcd-copyright mb-0">
                    Copyright <span class="dcd-copyright-mark" aria-label="copyright">&copy;</span> Drone &amp; Counter-Drone, All Rights Reserved.
                </p>
            </div>
        </div>
    </footer>
</div>
