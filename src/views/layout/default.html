<div class="landing-layout">
    <!-- GNB Header -->
    <header class="landing-gnb dcd-gnb" :class="{ 'gnb-scrolled': isScrolled }">
        <div class="container-fluid px-3 px-lg-4">
            <div class="d-flex align-items-center justify-content-between dcd-gnb-row">
                <!-- Logo -->
                <a href="#/home" class="dcd-brand text-decoration-none d-inline-flex align-items-center" aria-label="Drone & C-drone 홈">
                    <span class="dcd-brand-script" aria-hidden="true">Drone <span class="dcd-brand-amp">&amp;</span> C-drone</span>
                </a>

                <!-- Center Nav (desktop) -->
                <nav class="d-none d-lg-flex align-items-center gap-1 mx-auto" aria-label="주 메뉴">
                    <a class="dcd-nav-link" :class="{ active: isActive('/drone') }" href="#/drone" @click="guardNav($event)">DRONE</a>
                    <a class="dcd-nav-link" :class="{ active: isActive('/c-drone') }" href="#/c-drone" @click="guardNav($event)">C-DRONE</a>
                    <a class="dcd-nav-link" :class="{ active: isActive('/tactics') }" href="#/tactics" @click="guardNav($event)">TACTICS</a>
                    <a class="dcd-nav-link" :class="{ active: isActive('/others') }" href="#/others" @click="guardNav($event)">OTHERS</a>
                </nav>

                <!-- Right Actions (desktop) -->
                <div class="d-none d-lg-flex align-items-center">
                    <div class="dcd-auth" v-if="!isLoggedIn">
                        <a href="#/login/login" class="dcd-auth-link">로그인</a>
                        <span class="dcd-auth-sep" aria-hidden="true">|</span>
                        <a href="#/signup/signup" class="dcd-auth-link dcd-auth-cta">회원가입</a>
                    </div>
                    <div class="dcd-auth" v-else>
                        <span class="dcd-auth-user">{{ userName }}</span>
                        <span class="dcd-auth-sep" aria-hidden="true">|</span>
                        <button type="button" class="dcd-auth-link dcd-auth-btn" @click="handleLogout">로그아웃</button>
                    </div>
                </div>

                <!-- Mobile toggle -->
                <button class="dcd-mobile-toggle d-lg-none" type="button" @click="toggleMobileMenu" :aria-expanded="mobileMenuOpen" aria-label="메뉴 열기">
                    <i class="bi" :class="mobileMenuOpen ? 'bi-x-lg' : 'bi-list'"></i>
                </button>
            </div>
        </div>

        <!-- Mobile Slide-down Nav -->
        <div class="dcd-mobile-nav" v-show="mobileMenuOpen">
            <div class="container-fluid px-3 py-3">
                <nav class="d-flex flex-column" aria-label="모바일 메뉴">
                    <a class="dcd-mobile-link" :class="{ active: isActive('/drone') }" href="#/drone" @click="guardNav($event)">DRONE</a>
                    <a class="dcd-mobile-link" :class="{ active: isActive('/c-drone') }" href="#/c-drone" @click="guardNav($event)">C-DRONE</a>
                    <a class="dcd-mobile-link" :class="{ active: isActive('/tactics') }" href="#/tactics" @click="guardNav($event)">TACTICS</a>
                    <a class="dcd-mobile-link" :class="{ active: isActive('/others') }" href="#/others" @click="guardNav($event)">OTHERS</a>
                </nav>
                <div class="dcd-mobile-actions">
                    <div class="dcd-auth" v-if="!isLoggedIn">
                        <a href="#/login/login" class="dcd-auth-link" @click="closeMobileMenu">로그인</a>
                        <span class="dcd-auth-sep" aria-hidden="true">|</span>
                        <a href="#/signup/signup" class="dcd-auth-link dcd-auth-cta" @click="closeMobileMenu">회원가입</a>
                    </div>
                    <div class="dcd-auth" v-else>
                        <span class="dcd-auth-user">{{ userName }}</span>
                        <span class="dcd-auth-sep" aria-hidden="true">|</span>
                        <button type="button" class="dcd-auth-link dcd-auth-btn" @click="handleLogout">로그아웃</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        {{ content }}
    </main>

    <!-- Footer -->
    <footer class="dcd-footer">
        <div class="container-fluid px-3 px-lg-4">
            <div class="dcd-footer-row">
                <a href="#/home" class="dcd-brand text-decoration-none d-inline-flex align-items-center" aria-label="Drone & C-drone 홈">
                    <span class="dcd-brand-script dcd-brand-script-sm" aria-hidden="true">Drone <span class="dcd-brand-amp">&amp;</span> C-drone</span>
                </a>
                <p class="dcd-copyright mb-0">
                    Copyright <span class="dcd-copyright-mark" aria-label="copyright">&copy;</span> Drone &amp; Counter-Drone, All Rights Reserved.
                </p>
            </div>
        </div>
    </footer>
</div>
