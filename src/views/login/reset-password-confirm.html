<div style="background: var(--gray-50); min-height: 100%;">
<div class="container py-4 py-lg-5">
    <div class="d-flex justify-content-center">
        <div class="login-card">
            <!-- Title -->
            <h3 class="text-center fw-bold mb-2">새 비밀번호를 설정하세요</h3>
            <p class="text-center text-secondary small mb-4">
                보안을 위해 이전에 사용하지 않은<br>
                새로운 비밀번호를 설정해 주세요.
            </p>

            <!-- Password Form -->
            <form @submit.prevent="handleSubmit">
                <!-- 새 비밀번호 -->
                <div class="mb-2">
                    <label class="form-label fw-semibold">새 비밀번호</label>
                    <div class="position-relative">
                        <div class="position-absolute top-50 translate-middle-y ps-3">
                            <i class="bi bi-lock-fill text-secondary"></i>
                        </div>
                        <input :type="showPassword ? 'text' : 'password'"
                               class="form-control form-control-lg ps-5 pe-5"
                               :class="{ 'is-invalid': errors.password }"
                               v-model="form.password"
                               placeholder="새 비밀번호를 입력하세요"
                               @input="checkPasswordStrength">
                        <button type="button" class="login-password-toggle" @click="showPassword = !showPassword">
                            <i :class="showPassword ? 'bi bi-eye' : 'bi bi-eye-slash'"></i>
                        </button>
                    </div>
                </div>

                <!-- 비밀번호 강도 표시 -->
                <div class="d-flex gap-1 mb-1">
                    <div v-for="i in 4" :key="i" class="flex-fill rounded-pill" style="height: 4px;"
                         :style="{ background: i <= passwordStrength ? strengthColor : 'var(--gray-200)' }"></div>
                </div>
                <small class="text-secondary d-block mb-3">8~16자, 영문 대소문자·숫자·특수문자 조합 필수</small>
                <small v-if="errors.password" class="text-danger d-block mb-3">{{ errors.password }}</small>

                <!-- 새 비밀번호 확인 -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">새 비밀번호 확인</label>
                    <div class="position-relative">
                        <div class="position-absolute top-50 translate-middle-y ps-3">
                            <i class="bi bi-lock-fill text-secondary"></i>
                        </div>
                        <input :type="showPasswordConfirm ? 'text' : 'password'"
                               class="form-control form-control-lg ps-5 pe-5"
                               :class="{ 'is-invalid': errors.passwordConfirm }"
                               v-model="form.passwordConfirm"
                               placeholder="비밀번호를 한 번 더 입력하세요">
                        <button type="button" class="login-password-toggle" @click="showPasswordConfirm = !showPasswordConfirm">
                            <i :class="showPasswordConfirm ? 'bi bi-eye' : 'bi bi-eye-slash'"></i>
                        </button>
                    </div>
                    <small v-if="errors.passwordConfirm" class="text-danger">{{ errors.passwordConfirm }}</small>
                </div>

                <!-- 비밀번호 변경 완료 버튼 -->
                <button type="submit" class="btn login-submit-btn w-100 mb-3" :disabled="isSubmitting">
                    {{ isSubmitting ? '변경 중...' : '비밀번호 변경 완료하기' }}
                </button>
            </form>

            <!-- 로그인으로 돌아가기 -->
            <div class="text-center mt-3">
                <a href="#" class="text-secondary small text-decoration-none" @click.prevent="navigateTo('/login/login')">
                    <i class="bi bi-arrow-left me-1"></i>로그인 화면으로 돌아가기
                </a>
            </div>
        </div>
    </div>
</div>

<!-- 비밀번호 재설정 완료 모달 -->
<div class="signup-modal-overlay" v-if="showCompleteModal">
    <div class="signup-modal text-center">
        <button type="button" class="btn-close position-absolute top-0 end-0 m-3" @click="navigateTo('/login/login')"></button>
        <div class="d-flex justify-content-center mb-3">
            <div class="welcome-check-icon">
                <i class="bi bi-check-lg"></i>
            </div>
        </div>
        <h4 class="fw-bold mb-3">비밀번호가 재설정되었습니다</h4>
        <p class="text-secondary mb-4">새로운 비밀번호로 로그인하세요.</p>
        <button type="button" class="btn login-submit-btn w-100" @click="navigateTo('/login/login')">
            로그인으로 이동하기
        </button>
    </div>
</div>
</div>
