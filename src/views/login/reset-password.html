<div style="background: var(--gray-50); min-height: 100%;">
<div class="container py-4 py-lg-5">
    <div class="d-flex justify-content-center">
        <div class="login-card">
            <!-- 이메일 발송 완료 화면 -->
            <template v-if="isEmailSent">
                <div class="text-center">
                    <div class="d-flex justify-content-center mb-3">
                        <div class="welcome-check-icon">
                            <i class="bi bi-envelope-check"></i>
                        </div>
                    </div>
                    <h3 class="fw-bold mb-2">인증 메일을 발송했습니다</h3>
                    <p class="text-secondary small mb-4">
                        <strong>{{ form.email }}</strong> 으로<br>
                        비밀번호 재설정 인증 메일을 보내드렸습니다.<br>
                        메일함을 확인해 주세요.
                    </p>
                    <div class="p-3 rounded-3 mb-4" style="background: var(--gray-100);">
                        <p class="small text-secondary mb-0">
                            <i class="bi bi-info-circle me-1"></i>
                            메일이 도착하지 않은 경우, 스팸 메일함을 확인하거나<br>
                            아래 버튼을 눌러 다시 발송해 주세요.
                        </p>
                    </div>
                    <button type="button" class="btn btn-outline-secondary w-100 mb-3" @click="isEmailSent = false">
                        <i class="bi bi-arrow-counterclockwise me-1"></i>다시 발송하기
                    </button>
                </div>
                <div class="text-center mt-3">
                    <a href="#" class="text-secondary small text-decoration-none" @click.prevent="navigateTo('/login/login')">
                        <i class="bi bi-arrow-left me-1"></i>로그인 화면으로 돌아가기
                    </a>
                </div>
            </template>

            <!-- 이메일 입력 폼 -->
            <template v-else>
                <!-- Title -->
                <h3 class="text-center fw-bold mb-2">비밀번호 재설정하기</h3>
                <p class="text-center text-secondary small mb-4">
                    가입하신 이메일 주소를 입력하시면,<br>
                    비밀번호를 재설정할 수 있는 이메일 인증를 보내드립니다.
                </p>

                <!-- Reset Form -->
                <form @submit.prevent="handleSubmit">
                    <!-- 이메일 -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">이메일 주소</label>
                        <input type="email" class="form-control form-control-lg"
                               :class="{ 'is-invalid': errors.email }"
                               v-model="form.email"
                               placeholder="아이디로 등록된 이메일을 입력해 주세요">
                        <small v-if="errors.email" class="text-danger">{{ errors.email }}</small>
                    </div>

                    <!-- 아이디 기억하기 -->
                    <div class="form-check mb-4">
                        <input type="checkbox" class="form-check-input" id="rememberEmail" v-model="rememberEmail">
                        <label class="form-check-label" for="rememberEmail">아이디 기억하기</label>
                    </div>

                    <!-- 인증 메일 발송 버튼 -->
                    <button type="submit" class="btn login-submit-btn w-100 mb-3" :disabled="isSubmitting">
                        <i class="bi bi-envelope me-2"></i>
                        {{ isSubmitting ? '발송 중...' : '인증 메일 발송하기' }}
                    </button>
                </form>

                <!-- 로그인으로 돌아가기 -->
                <div class="text-center mt-3">
                    <a href="#" class="text-secondary small text-decoration-none" @click.prevent="navigateTo('/login/login')">
                        <i class="bi bi-arrow-left me-1"></i>로그인 화면으로 돌아가기
                    </a>
                </div>
            </template>
        </div>
    </div>
</div>
</div>
