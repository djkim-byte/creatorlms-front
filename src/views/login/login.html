<div class="login-page">
    <div class="container pt-3 pt-lg-4 pb-4 pb-lg-5">
        <div class="d-flex justify-content-center">
            <div class="login-card">
                <!-- Title -->
                <h3 class="text-center fw-bold mb-4">로그인</h3>

                <!-- Login Form -->
                <form @submit.prevent="handleLogin" novalidate>
                    <!-- 아이디 -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="loginEmail">아이디</label>
                        <input id="loginEmail" type="email" class="form-control form-control-lg"
                               :class="{ 'is-invalid': errors.email }"
                               v-model="form.email"
                               placeholder="이메일을 입력해 주세요"
                               autocomplete="username">
                        <small v-if="errors.email" class="text-danger d-block mt-1">{{ errors.email }}</small>
                    </div>

                    <!-- 비밀번호 -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="loginPassword">비밀번호</label>
                        <div class="position-relative">
                            <input id="loginPassword" :type="showPassword ? 'text' : 'password'"
                                   class="form-control form-control-lg pe-5"
                                   :class="{ 'is-invalid': errors.password }"
                                   v-model="form.password"
                                   placeholder="비밀번호(영문, 숫자, 특수문자 조합으로 8자 이상) 를 입력해 주세요"
                                   autocomplete="current-password">
                            <button type="button" class="login-password-toggle" @click="showPassword = !showPassword"
                                    :aria-label="showPassword ? '비밀번호 숨기기' : '비밀번호 표시'">
                                <i :class="showPassword ? 'bi bi-eye' : 'bi bi-eye-slash'"></i>
                            </button>
                        </div>
                        <small v-if="errors.password" class="text-danger d-block mt-1">{{ errors.password }}</small>
                    </div>

                    <!-- 아이디 기억하기 -->
                    <div class="form-check mb-4">
                        <input type="checkbox" class="form-check-input" id="rememberEmail" v-model="rememberEmail">
                        <label class="form-check-label fw-semibold" for="rememberEmail">아이디 기억하기</label>
                    </div>

                    <!-- 로그인 버튼 -->
                    <button type="submit" class="btn login-submit-btn w-100 mb-3" :disabled="isSubmitting">
                        <span class="login-btn-icon" aria-hidden="true">
                            <i class="bi bi-info-circle"></i>
                        </span>
                        <span>{{ isSubmitting ? '로그인 중...' : '로그인 하기' }}</span>
                    </button>
                </form>

                <!-- 비밀번호 재설정 -->
                <div class="text-center">
                    <span class="text-secondary small">비밀번호가 생각나지 않으신다면</span>
                    <a href="#" class="fw-semibold small text-dark text-decoration-underline ms-2" @click.prevent="handleResetPassword">비밀번호 재설정</a>
                </div>
            </div>
        </div>
    </div>
</div>
